<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormCheck JS — Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>📋 Register</h1>
      <p class="subtitle">Create your account below</p>

      <form id="registerForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" />
          <span class="error" id="nameError"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />
          <span class="error" id="emailError"></span>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" />
          <span class="error" id="phoneError"></span>
        </div>

        <!-- Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="john_doe" />
          <span class="error" id="usernameError"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min 8 chars" />
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
          <span class="error" id="passwordError"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" />
          <span class="error" id="confirmPasswordError"></span>
        </div>

        <!-- Age -->
        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" placeholder="Must be 18+" />
          <span class="error" id="ageError"></span>
        </div>

        <!-- Website -->
        <div class="form-group">
          <label for="website">Website <span class="optional">(optional)</span></label>
          <input type="text" id="website" name="website" placeholder="https://yoursite.com" />
          <span class="error" id="websiteError"></span>
        </div>

        <button type="submit" class="btn">Create Account</button>

        <div class="success-msg" id="successMsg">
          ✅ Account created successfully! Welcome aboard.
        </div>

      </form>
    </div>
  </div>

  <!-- FormCheck loaded from local dist (after npm install, use node_modules path) -->
  <script src="../../dist/index.cjs.js"></script>
  <script src="app.js"></script>

</body>
</html>
